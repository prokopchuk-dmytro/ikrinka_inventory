client_id = "329fc2f173a190be995582261befd49e"
name = "Inventory Manager"
handle = "inventory-manager-57"
application_url = "https://moreover-lan-cgi-tiles.trycloudflare.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[auth]
redirect_urls = ["https://moreover-lan-cgi-tiles.trycloudflare.com/auth/callback", "https://moreover-lan-cgi-tiles.trycloudflare.com/auth/shopify/callback", "https://moreover-lan-cgi-tiles.trycloudflare.com/api/auth/callback"]

[access_scopes]
scopes = "write_orders,write_inventory,read_orders,read_inventory"

[pos]
embedded = false
